appId: com.shanhaibu.app
productName: 山海簿
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/sql.js/dist/sql-wasm.wasm"
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 山海簿
  uninstallDisplayName: 山海簿
portable:
  artifactName: ${productName}-${version}-portable.${ext}